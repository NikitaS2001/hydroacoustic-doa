[project]
name = "hydro-doa-mvp"
version = "0.1.0"
description = "Geometry-conditioned hydroacoustic DOA: BELLHOP MVP implementation (protocol control plane docs/experiments/bellhop_mvp_protocol.md)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.10,<1.14",  # arlpy 1.9.x pins scipy<1.14
    "arlpy>=1.9.1",
    "pandas>=2.0",
    "soundfile>=0.12",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "ty>=0.0.1a5",
    "marimo>=0.9",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hydro_doa_mvp"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "PIE", "RET", "SIM", "PL"]
ignore = ["PLR0913", "PLR2004"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ty.src]
include = ["src"]
